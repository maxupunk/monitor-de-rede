version: '3.8'

services:
  server:
    build: .
    command: node bin/server.js
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=netmonitor
      - DB_PASSWORD=secret
      - DB_DATABASE=netmonitor
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: node ace queue:work
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  scheduler:
    build: .
    command: node ace scheduler:run
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  probe:
    build: .
    command: node ace probe:run
    network_mode: host
    environment:
      - NODE_ENV=production
      - SERVER_URL=http://localhost:3333
    depends_on:
      - server

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netmonitor
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: netmonitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
