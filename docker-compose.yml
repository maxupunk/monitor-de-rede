# Stack do NetMonitor — backend Rust (Loco.rs).
#
# O corte do AdonisJS aconteceu na Fase 9 do `docs/roadmap_backend_rust.md`.
# Os cinco processos abaixo são os mesmos de antes, com os comandos traduzidos:
# `node ace migration:run` → `db migrate`, `scheduler:run` → o scheduler nativo
# do Loco, `probe:run` → `task probe_run`.
x-app-env: &app-env
  LOCO_ENV: production
  PORT: 3333
  HOST: 0.0.0.0
  LOG_LEVEL: info
  # Cifra em repouso dos segredos da VPN (§8.10) — 32 caracteres.
  APP_KEY: secret_app_key_32_characters_long_str
  # Assinatura do JWT (§10). Trocar em produção — e o valor **precisa ser base64
  # válido**: o Loco assina com `EncodingKey::from_base64_secret` (HS512). Um
  # segredo não-base64 não derruba o servidor; ele faz `generate_jwt` falhar e
  # todo login responder 401 com a mesma mensagem de senha inválida.
  JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLW1lLXRoaXMtaXMtYS1wbGFjZWhvbGRlci1zZWNyZXQtdmFsdWUtMDAwMQ==}
  DATABASE_URL: postgres://netmonitor:secret@postgres:5432/netmonitor

# `ping_group_range` habilita o socket ICMP `SOCK_DGRAM` sem `CAP_NET_RAW`
# (SPIKE-03 / ADR 003). Vale para todo processo que pinga: `server` (checagem
# manual e discovery), `scheduler` (o ciclo de monitores) e `probe`.
x-icmp-sysctls: &icmp-sysctls
  net.ipv4.ping_group_range: "0 2147483647"

services:
  migration:
    build: ./backend-rust
    command: ["backend_rust-cli", "db", "migrate"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [netmonitor-net]
    restart: "no"

  server:
    build: ./backend-rust
    command: ["backend_rust-cli", "start"]
    ports:
      - "${API_EXTERNAL_PORT:-3333}:3333"
    environment:
      <<: *app-env
      # Volume compartilhado com o container WireGuard (hot-reload por arquivo)
      WG_CONFIG_DIR: /config
      VPN_PROBE_TOKEN: ${VPN_PROBE_TOKEN:-default_vpn_probe_token}
    sysctls:
      <<: *icmp-sysctls
    ulimits:
      # O batch do port scanner deriva do limite de descritores (§3.3.1).
      nofile:
        soft: 8192
        hard: 65536
    volumes:
      - wg-config:/config
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks: [netmonitor-net]
    restart: unless-stopped

  scheduler:
    build: ./backend-rust
    # O scheduler nativo do Loco dispara `scheduler_run` a cada 5 s
    # (ADR 005): cada tique é um ciclo, não um laço infinito.
    command: ["backend_rust-cli", "scheduler", "--config", "config/scheduler.yaml"]
    environment:
      <<: *app-env
      # É o scheduler quem sincroniza a telemetria dos túneis a cada 10s. Sem o
      # mesmo volume do `server`, `wg0.status` não existe aqui e a sincronização
      # vira um no-op silencioso: a tela recebe eventos com dados congelados.
      WG_CONFIG_DIR: /config
    sysctls:
      <<: *icmp-sysctls
    ulimits:
      nofile:
        soft: 8192
        hard: 65536
    volumes:
      - wg-config:/config
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks: [netmonitor-net]
    restart: unless-stopped

  probe:
    build: ./backend-rust
    command: ["backend_rust-cli", "task", "probe_run"]
    environment:
      <<: *app-env
      PROBE_SERVER_URL: http://server:3333
      SERVER_URL: http://server:3333
    sysctls:
      <<: *icmp-sysctls
    depends_on:
      - server
    networks: [netmonitor-net]
    restart: unless-stopped

  # Servidor WireGuard: único container com NET_ADMIN e única porta publicada.
  wireguard:
    image: linuxserver/wireguard:latest
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-UTC}
      WG_INTERFACE: wg0
    ports:
      # Mapeada 1:1 de propósito: é a porta que os roteadores usam como Endpoint,
      # e precisa ser a mesma configurada em "Porta UDP" na tela /vpn.
      - "${WG_EXTERNAL_PORT:-51820}:${WG_EXTERNAL_PORT:-51820}/udp"
    volumes:
      - wg-config:/config
      - ./docker/wireguard/custom-cont-init.d:/custom-cont-init.d:ro
      - ./docker/wireguard/scripts:/custom-scripts:ro
    networks: [netmonitor-net]
    restart: unless-stopped

  # Probe dedicado que enxerga a interface wg0 — o probe da LAN segue intocado.
  vpn-probe:
    build: ./backend-rust
    command: ["backend_rust-cli", "task", "probe_run"]
    environment:
      <<: *app-env
      PROBE_SERVER_URL: http://server:3333
      SERVER_URL: http://server:3333
      PROBE_TOKEN: ${VPN_PROBE_TOKEN:-default_vpn_probe_token}
      # A telemetria do túnel é lida do volume compartilhado, nunca por
      # `docker exec` — é o que mantém o servidor sem acesso ao socket do Docker.
      WG_CONFIG_DIR: /config
    volumes:
      - wg-config:/config
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
      - server
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-8081}:80"
    depends_on:
      - server
    networks: [netmonitor-net]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netmonitor
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: netmonitor
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netmonitor -d netmonitor"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [netmonitor-net]
    restart: unless-stopped

volumes:
  pgdata:
  wg-config:

networks:
  netmonitor-net:
    driver: bridge
