services:
  server:
    build: .
    command: node bin/server.js
    ports:
      - "${API_PORT:-3333}:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - APP_KEY=secret_app_key_32_characters_long_str
      - APP_URL=http://localhost:3333
      - SESSION_DRIVER=cookie
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=netmonitor
      - DB_PASSWORD=secret
      - DB_DATABASE=netmonitor
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: node ace queue:work
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - APP_KEY=secret_app_key_32_characters_long_str
      - APP_URL=http://localhost:3333
      - SESSION_DRIVER=cookie
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  scheduler:
    build: .
    command: node ace scheduler:run
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - APP_KEY=secret_app_key_32_characters_long_str
      - APP_URL=http://localhost:3333
      - SESSION_DRIVER=cookie
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  probe:
    build: .
    command: node ace probe:run
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - APP_KEY=secret_app_key_32_characters_long_str
      - APP_URL=http://server:3333
      - SESSION_DRIVER=cookie
      - SERVER_URL=http://server:3333
    depends_on:
      - server

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - server

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netmonitor
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: netmonitor
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  pgdata:
