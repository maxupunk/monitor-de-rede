# Stack do NetMonitor: aplicação, SPA, scheduler, Syslog e WireGuard no mesmo
# serviço, e o agente local ao lado, dono do Docker deste host (ADR 014). Para
# compartilhar diretamente a rede do host, use o override
# `docker-compose.host.yml`, selecionável pelo `.env`.

services:
  netmonitor:
    build:
      context: .
      target: runtime
      # Compilações em paralelo no build (memória): ver o `.env.example`.
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-4}
    image: netmonitor:latest
    # A interface não para, remove nem recria este container: o agente local
    # recusa ação sobre quem tem esta label (derrubaria a própria tela).
    labels:
      com.netmonitor.protected: "true"
    # `ping_group_range` habilita o socket ICMP `SOCK_DGRAM` sem `CAP_NET_RAW`
    # (SPIKE-03 / ADR 003) — é o que permite a aplicação pingar como `app`.
    # Os outros dois são do WireGuard: roteamento entre peers e a marca de
    # origem que o `wg-quick` exige.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    # Fica com o watcher, o processo root do container. O entrypoint remove as
    # capabilities antes de chamar a aplicação (`setpriv --inh-caps=-all`).
    # Sem VPN? `WG_ENABLED=false` no `.env` e esta linha pode sair.
    cap_add:
      - NET_ADMIN
    # O batch do port scanner deriva do limite de descritores.
    ulimits:
      nofile:
        soft: 8192
        hard: 65536
    # Dentro do container `127.0.0.1` é o próprio container. Para fazer backup
    # de um banco ou NAS que roda nesta máquina, cadastre o servidor como
    # `host.docker.internal` — o Docker Desktop já o resolve; esta linha faz o
    # mesmo no Docker do Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Interface web e API na mesma porta — não há mais duas.
      - "${APP_EXTERNAL_PORT:-3333}:${APP_PORT:-3333}"
      # Porta UDP do WireGuard. No modo bridge, mapeia a porta pública para a
      # porta de escuta do túnel (padrão 51820).
      - "${WG_EXTERNAL_PORT:-51820}:${WG_LISTEN_PORT:-51820}/udp"
      # Syslog. O roteador manda para a 514, que é o padrão do protocolo e o
      # que todo firmware assume; o processo escuta na 5514 porque roda com
      # `CapEff` zerado (`setpriv --inh-caps=-all`) e não abre porta
      # privilegiada. É esta linha que faz a ponte — sem `CAP_NET_BIND` na
      # aplicação, que atravessaria a fronteira do §7 do AGENTS.md.
      #
      # ⚠ **A publicação reescreve o IP de origem.** Era o item aberto da
      # ADR 008 e está medido: no Docker Desktop (Windows e macOS) sempre, e no
      # Linux sempre que o `userland-proxy` entra no caminho, o pacote chega ao
      # container vindo do gateway da bridge — `172.17.0.1`, `192.168.65.1` — e
      # não do roteador. Como o vínculo log→dispositivo é por endereço, o parque
      # inteiro vira uma origem só.
      #
      # O servidor detecta isso sozinho (`services/syslog/nat.rs`), passa a
      # resolver pelo `HOSTNAME` que o equipamento envia e avisa na tela. Isso
      # faz o recurso funcionar, mas depende de cada aparelho mandar um nome
      # distinto — RouterOS sem `bsd-syslog=yes` não manda.
      #
      # **Para receber o endereço real**, troque a publicação por rede do host:
      # comente o bloco `ports:` inteiro, acrescente `network_mode: host` ao
      # serviço e defina `SYSLOG_EXTERNAL_PORT=5514`. Sem mapeamento não há
      # tradução, e o processo continua sem capability nenhuma — só que aí a
      # porta que o roteador precisa usar é a 5514, e é por isso que a variável
      # existe: é ela que entra nos comandos que a tela gera.
      - "${SYSLOG_EXTERNAL_PORT:-514}:${SYSLOG_LISTEN_PORT:-5514}/udp"
      - "${SYSLOG_EXTERNAL_PORT:-514}:${SYSLOG_LISTEN_PORT:-5514}/tcp"
      # Servidor btest (MikroTik Bandwidth Test) do teste de enlace, ADR 015.
      # Fica fechado: só atende o IP de origem para o qual a central armou uma
      # sessão. Como no syslog, a publicação pode reescrever o IP de origem
      # (Docker Desktop, `userland-proxy`); aí o teste MikroTik → central não
      # casa com a sessão e é preciso a rede do host (docker-compose.host.yml).
      - "2000:2000/tcp"
    environment:
      LOCO_ENV: production
      # Chave do Ollaya, lida pela API (Decisor) no ponto de uso — o mesmo valor
      # vai ao serviço `ollaya` abaixo, então não se digita em tela nenhuma.
      OLLAYA_API_KEY: ${OLLAYA_API_KEY:-}
      TZ: ${TZ:-America/Fortaleza}
      # Porta real da API dentro do container. No modo host é também a porta que
      # o navegador acessa; na bridge, `APP_EXTERNAL_PORT` pode ser diferente.
      APP_PORT: ${APP_PORT:-3333}
      # Porta publicada no host. Entra nos comandos de instalação do agente
      # remoto que chega pela rede local ou pela internet (pelo túnel VPN ele
      # fala direto com a `APP_PORT`).
      APP_EXTERNAL_PORT: ${APP_EXTERNAL_PORT:-3333}
      # Cifra em repouso dos segredos da VPN. Trocar o valor torna ilegível tudo
      # que já foi cifrado com o anterior.
      # Em produção a variável é obrigatória: o boot falha se não estiver definida.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Assinatura do JWT. Trocar em produção — e o valor **precisa ser base64
      # válido**: o Loco assina com `EncodingKey::from_base64_secret` (HS512).
      # Um segredo não-base64 não derruba o servidor; ele faz `generate_jwt`
      # falhar e todo login responder 401 com a mensagem de senha inválida.
      # Em produção a variável é obrigatória: o boot falha se não estiver definida.
      JWT_SECRET: ${JWT_SECRET:-}
      # SQLite no volume. Sem interpolação de propósito: a `DATABASE_URL` do
      # `.env` descreve o caminho visto **da máquina**, e ela não vale aqui
      # dentro. Para apontar a um Postgres externo, edite esta linha.
      DATABASE_URL: sqlite:///data/netmonitor.sqlite?mode=rwc
      # Pool de conexões, em milissegundos. Repassados aqui porque o
      # `config/*.yaml` vai assado dentro da imagem: sem estas linhas, ajustar
      # os tempos exigiria `--build`.
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5000}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-300000}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-1}
      # SQLite é o padrão e usa um único writer; pools maiores multiplicam o
      # cache e os buffers temporários. PostgreSQL pode sobrescrever para 10.
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      # Token exigido no cadastro do primeiro usuário. Deixe vazio e o servidor
      # sorteia um no primeiro boot, imprimindo-o no log (`docker compose logs
      # netmonitor | grep setup_token`). Definir aqui só interessa a
      # provisionamento automatizado, que precisa conhecer o valor antes de o
      # container subir.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-5}
      # Origem liberada no CORS. Só importa a quem serve a SPA de outro
      # endereço: servida daqui, a origem é a mesma e o CORS nem entra em cena.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3333}
      # Token do probe remoto — o mesmo valor precisa ir no container de lá.
      VPN_PROBE_TOKEN: ${VPN_PROBE_TOKEN:-default_vpn_probe_token}
      # Porta UDP de escuta e externa da VPN WireGuard
      WG_LISTEN_PORT: ${WG_LISTEN_PORT:-51820}
      WG_EXTERNAL_PORT: ${WG_EXTERNAL_PORT:-51820}
      # --- armazenamentos (destinos do backup das configurações) ---
      # Raiz dos armazenamentos do tipo "Pasta no servidor": a tela só deixa
      # escolher subpastas daqui. Fica no volume de dados, então sobrevive a
      # recriar o container — mas não a perder o volume. Para gravar num disco
      # externo ou NAS, monte-o dentro da raiz, por exemplo em `volumes:`:
      #   - /mnt/nas/netmonitor:/data/storage/nas
      # e cadastre a subpasta `nas`. Sem interpolação, pelo mesmo motivo da
      # `DATABASE_URL`: é um caminho visto de dentro do container.
      STORAGE_LOCAL_ROOT: /data/storage
      # --- servidor de syslog ---
      # Sem interpolação no caminho do banco, pelo mesmo motivo da
      # `DATABASE_URL`: o `.env` descreve a máquina, não o container. Vazio
      # (o padrão) faz o banco de logs nascer ao lado do principal, em
      # /data/logs.sqlite.
      SYSLOG_ENABLED: ${SYSLOG_ENABLED:-true}
      SYSLOG_DB_URL: ${SYSLOG_DB_URL:-}
      # Porta real dos listeners sem privilégio dentro do container. O override
      # de rede host anuncia esta mesma porta aos equipamentos.
      SYSLOG_UDP_PORT: ${SYSLOG_LISTEN_PORT:-5514}
      SYSLOG_TCP_PORT: ${SYSLOG_LISTEN_PORT:-5514}
      # A porta que o **roteador** deve usar — a publicada acima, não a de
      # escuta. Entra nos comandos que a tela gera e no acesso automático por
      # SSH. Em `network_mode: host` não há publicação e o valor certo é 5514.
      SYSLOG_EXTERNAL_PORT: ${SYSLOG_EXTERNAL_PORT:-514}
      # Endereços a tratar como gateway de NAT, além dos que o servidor descobre
      # sozinho (a rota padrão do container e as faixas que o Docker aloca).
      # Só é preciso preencher com `docker network create --subnet` fora do pool
      # padrão, ou com um relay de syslog na frente. Lista separada por vírgula.
      SYSLOG_NAT_GATEWAYS: ${SYSLOG_NAT_GATEWAYS:-}
      # Só grava log de IP que resolva para um dispositivo cadastrado ou que
      # caia no CIDR de uma rede cadastrada. Ligar isto faz um host solto na
      # rede encher o volume sozinho — a tela /logs mostra as fontes vistas
      # justamente para não ser preciso.
      SYSLOG_ACCEPT_UNKNOWN_SOURCES: ${SYSLOG_ACCEPT_UNKNOWN_SOURCES:-false}
      # --- teste de enlace (ADR 015) ---
      # Escuta do servidor btest da central. Vazio desliga; porta ocupada só
      # gera aviso no log, sem derrubar a API.
      BTEST_LISTEN: ${BTEST_LISTEN-0.0.0.0:2000}
      # Retenção: dias e tamanho, o que vencer primeiro. Medido em ~290 B por
      # linha com os três índices (ADR 008).
      RETENTION_LOGS_DAYS: ${RETENTION_LOGS_DAYS:-7}
      RETENTION_LOGS_MAX_MB: ${RETENTION_LOGS_MAX_MB:-4096}
      # Gerenciador Docker (ADR 014). A API **não** monta o socket da Engine:
      # quem monta é o agente local, logo abaixo, e a API fala com ele pelo
      # mesmo canal dos agentes remotos. No boot ela grava aqui o token dele
      # — o arquivo só existe no volume que os dois compartilham. Sem esta
      # variável o Docker deste host simplesmente não aparece na tela.
      LOCAL_AGENT_TOKEN_FILE: /local-agent/token
    volumes:
      # Um volume só: o banco em /data/netmonitor.sqlite e a configuração do
      # túnel em /data/wg. O `wg0.conf` é reescrito a partir do banco a cada
      # mudança de peer, então o que precisa mesmo sobreviver é o banco.
      - netmonitor-data:/data
      # Só o token do agente local: a API escreve, o agente lê.
      - netmonitor-local-agent:/local-agent
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /run:noexec,nosuid,size=10m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Agente local (ADR 014): o Docker deste host, gerenciado pela tela. É ele —
  # e não a API — que monta o socket da Engine; a API o comanda pelo canal dos
  # agentes remotos (ADR 011), e o que ele aceita é decidido aqui, em
  # `LOCAL_AGENT_ALLOW`: a central não amplia a lista. Um comprometimento da
  # API, portanto, não vira root no host. Sem Docker para gerenciar? Remova
  # este serviço; a tela de Docker fica só com os servidores remotos.
  netmonitor-agent:
    build:
      context: .
      target: agent
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-4}
    image: netmonitor-agent:latest
    # Parar o agente cortaria o Docker da tela sem volta: ele mesmo recusa,
    # e a label o marca para a tela não oferecer o botão.
    labels:
      com.netmonitor.protected: "true"
    depends_on:
      - netmonitor
    environment:
      # A API pela rede interna do compose. Não é a porta publicada: o agente
      # fala direto com o container.
      AGENT_SERVER_URL: http://netmonitor:${APP_PORT:-3333}
      # O token que a API grava no boot (`LOCAL_AGENT_TOKEN_FILE`). O agente
      # relê o arquivo a cada tentativa de conexão: um token novo vale sem
      # reiniciar nada.
      AGENT_TOKEN_FILE: /local-agent/token
      # Política local. O padrão libera o que a tela oferece para este host:
      # ver, ciclo de vida, pull/recriação, compose, exportar volume e rodar os
      # monitores de container deste servidor (`monitor`). Para um host só de
      # leitura, `read,monitor`.
      AGENT_ALLOW: ${LOCAL_AGENT_ALLOW:-read,lifecycle,update,compose,volume_export,monitor}
      # Desliga o acesso à Engine sem reconstruir a imagem.
      DOCKER_ENABLED: ${DOCKER_ENABLED:-true}
      TZ: ${TZ:-America/Fortaleza}
    volumes:
      # API nativa da Engine. Só este container a monta.
      - /var/run/docker.sock:/var/run/docker.sock
      # Métricas do host (CPU, memória, disco) para o histórico.
      - /proc:/host/proc:ro
      - /:/host:ro
      - netmonitor-local-agent:/local-agent:ro
      # Resultados que esperam a central voltar (buffer offline).
      - netmonitor-agent-state:/var/lib/netmonitor-agent
      # Compose: os projetos precisam aparecer no mesmo caminho do host.
      # Descomente e ajuste para as pastas dos seus projetos.
      # - /srv:/srv:ro
      # - /opt:/opt:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Ollaya: serve os modelos de decisão do Decisor (escolhas rápidas da IA,
  # sem tokens). Sobe sempre junto — parado, sem modelo carregado, ocupa
  # ~150 MB. Só pesa quando o Decisor é ligado em Configurações → IA e um
  # modelo é carregado; `OLLAYA_KEEP_ALIVE` o descarrega depois do tempo
  # ocioso. Quanto pesa depende do modelo, que a tela lista pela nota no
  # benchmark do NetMonitor (página Benchmark dos modelos) e, sem ela, pelo
  # teste público de 10/10/2026. Em resumo:
  #   - netmonitor/decima-network:v5 (padrão): 0,5 GB, ajustado nas decisões
  #     do NetMonitor — 92% no benchmark dele, 0,5 s por decisão em CPU. Vem
  #     instalado pelo serviço `ollaya-models` (abaixo);
  #   - kev:0.8b: 1,8 GB, 68% no benchmark do NetMonitor, segundos em CPU;
  #   - jeb:4b: 4,6 GB, o melhor com GPU (90,5%, 89% em português);
  #   - kev:4b, decider:4b, kev:9b…: de 8 a 20 GB e GPU — em CPU cada pergunta
  #     do chat espera segundos;
  #   - laya: o mais leve, mas perto do chute no teste (37–43%).
  # Sem RAM ou GPU sobrando aqui? Na mesma tela dá para apontar para um Ollaya
  # em outra máquina ou para um provedor na nuvem (TypeSafe, OpenRouter,
  # Cloudflare, OpenAI) — aí este serviço pode até ser removido.
  # A API fala com ele pela rede interna (`http://ollaya:11435`), sem porta
  # publicada. No modo host (`docker-compose.host.yml`) a API sai dessa rede: o
  # override põe o Ollaya também na rede do host, só no loopback
  # (`127.0.0.1`), e define `OLLAYA_URL`. Montado de
  # outro jeito, a API ainda procura sozinha em 127.0.0.1:11435 e
  # host.docker.internal:11435 (`decider/locate.rs`). GPU NVIDIA? Troque a imagem por `ghcr.io/ollaya-dev/ollaya:cuda`
  # e acrescente `gpus: all`.
  ollaya:
    image: ghcr.io/ollaya-dev/ollaya:latest
    environment:
      OLLAYA_HOST: 0.0.0.0:11435
      # Tempo ocioso até descarregar o modelo e devolver a RAM. Carregar de
      # novo custa de 5 a 15 s na primeira pergunta depois da pausa.
      OLLAYA_KEEP_ALIVE: ${OLLAYA_KEEP_ALIVE:-30m}
      # Vazio = sem autenticação (só a rede interna o alcança). Definida no
      # `.env`, o compose entrega o mesmo valor à API (serviço `netmonitor`).
      OLLAYA_API_KEY: ${OLLAYA_API_KEY:-}
    volumes:
      # É aqui que o Ollaya guarda os modelos (o log mostra
      # `models=/home/ollaya/.ollaya/models`). Montar em outro lugar deixa o
      # download num volume anônimo, perdido a cada recriação do container.
      - ollaya-models:/home/ollaya/.ollaya
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Instala no volume do Ollaya os modelos que vêm com o NetMonitor
  # (`docker/ollaya-models/`, hoje o netmonitor/decima-network:v5) e sai. Roda
  # a cada `up`: modelo já instalado não baixa nada, todo blob é conferido pelo
  # sha256 e o manifesto vai por último — o Ollaya só lista modelo completo.
  # Os pesos vêm de `docker/ollaya-models/<modelo>/blobs/` quando estão lá
  # (instalação sem internet) ou de `DECIDER_MODELS_URL`.
  ollaya-models:
    build: ./docker/ollaya-models
    image: netmonitor-ollaya-models:latest
    environment:
      # Vazio: a release do projeto (o padrão fica no install.sh).
      DECIDER_MODELS_URL: ${DECIDER_MODELS_URL:-}
    volumes:
      - ollaya-models:/ollaya
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  netmonitor-data:
  netmonitor-local-agent:
  netmonitor-agent-state:
  ollaya-models:
