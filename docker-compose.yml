x-app-env: &app-env
  NODE_OPTIONS: "--max-old-space-size=256"
  NODE_ENV: production
  PORT: 3333
  HOST: 0.0.0.0
  LOG_LEVEL: info
  APP_KEY: secret_app_key_32_characters_long_str
  APP_URL: http://localhost:3333
  SESSION_DRIVER: cookie
  DB_CONNECTION: pg
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: netmonitor
  DB_PASSWORD: secret
  DB_DATABASE: netmonitor

services:
  migration:
    build: .
    command: node ace.js migration:run --force
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [netmonitor-net]
    restart: "no"

  server:
    build: .
    command: node bin/server.js
    ports:
      - "${API_EXTERNAL_PORT:-3333}:3333"
    environment:
      <<: *app-env
      # Volume compartilhado com o container WireGuard (hot-reload por arquivo)
      WG_CONFIG_DIR: /config
      VPN_PROBE_TOKEN: ${VPN_PROBE_TOKEN:-}
    volumes:
      - wg-config:/config
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks: [netmonitor-net]
    restart: unless-stopped

  scheduler:
    build: .
    command: node ace.js scheduler:run
    environment:
      <<: *app-env
      # É o scheduler quem sincroniza a telemetria dos túneis a cada 10s. Sem o
      # mesmo volume do `server`, `wg0.status` não existe aqui e a sincronização
      # vira um no-op silencioso: a tela recebe eventos com dados congelados.
      WG_CONFIG_DIR: /config
    volumes:
      - wg-config:/config
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks: [netmonitor-net]
    restart: unless-stopped

  probe:
    build: .
    command: node ace.js probe:run
    environment:
      <<: *app-env
      APP_URL: http://server:3333
      PROBE_SERVER_URL: http://server:3333
      SERVER_URL: http://server:3333
    depends_on:
      - server
    networks: [netmonitor-net]
    restart: unless-stopped

  # Servidor WireGuard: único container com NET_ADMIN e única porta publicada.
  wireguard:
    image: linuxserver/wireguard:latest
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-UTC}
      WG_INTERFACE: wg0
    ports:
      # Mapeada 1:1 de propósito: é a porta que os roteadores usam como Endpoint,
      # e precisa ser a mesma configurada em "Porta UDP" na tela /vpn.
      - "${WG_EXTERNAL_PORT:-51820}:${WG_EXTERNAL_PORT:-51820}/udp"
    volumes:
      - wg-config:/config
      - ./docker/wireguard/custom-cont-init.d:/custom-cont-init.d:ro
      - ./docker/wireguard/scripts:/custom-scripts:ro
    networks: [netmonitor-net]
    restart: unless-stopped

  # Probe dedicado que enxerga a interface wg0 — o probe da LAN segue intocado.
  vpn-probe:
    build: .
    command: node ace.js probe:run
    environment:
      <<: *app-env
      APP_URL: http://server:3333
      PROBE_SERVER_URL: http://server:3333
      SERVER_URL: http://server:3333
      PROBE_TOKEN: ${VPN_PROBE_TOKEN:-}
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
      - server
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-8081}:80"
    depends_on:
      - server
    networks: [netmonitor-net]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netmonitor
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: netmonitor
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netmonitor -d netmonitor"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [netmonitor-net]
    restart: unless-stopped

volumes:
  pgdata:
  wg-config:

networks:
  netmonitor-net:
    driver: bridge
