<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Plataforma de Monitoramento de Redes em Tempo Real e Alertas Inteligentes">

  <!-- Mobile & iOS PWA tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NetMonitor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>NetMonitor - Monitoramento de Rede</title>
  <link rel="manifest" href="manifest.json">

  <!-- Captura o prompt de instalação PWA antes da inicialização do Flutter -->
  <script>
    (function () {
      var deferredPrompt = null;
      var listeners = [];

      function notify() {
        for (var i = 0; i < listeners.length; i++) {
          try {
            listeners[i]();
          } catch (_) {}
        }
      }

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        notify();
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        notify();
      });

      window.__netmonitorPwa = {
        canInstall: function () {
          return deferredPrompt !== null;
        },
        isInstalled: function () {
          return (
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          );
        },
        isIosSafari: function () {
          var ua = window.navigator.userAgent || '';
          var isIos = /iPad|iPhone|iPod/.test(ua);
          var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
          return isIos && isSafari;
        },
        promptInstall: function () {
          if (!deferredPrompt) {
            return Promise.resolve(false);
          }
          var promptEvent = deferredPrompt;
          deferredPrompt = null;
          promptEvent.prompt();
          return promptEvent.userChoice
            .then(function (choice) {
              notify();
              return choice && choice.outcome === 'accepted';
            })
            .catch(function () {
              notify();
              return false;
            });
        },
        subscribe: function (cb) {
          listeners.push(cb);
        }
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
