# Override opcional para receber a rede do host sem NAT da bridge.
#
# Ative pelo `.env`:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.host.yml
#   APP_PORT=3334
#
# `!reset` remove publicação de portas e sysctls do namespace do container,
# opções incompatíveis com `network_mode: host`.
services:
  # ⚠ Sem os sysctls do compose, o `net.ipv4.ping_group_range` que vale é o
  # **do host** — e o padrão do kernel (`1 0`) fecha o ping sem privilégio da
  # API (ADR 003): monitores de ping e varredura ICMP falham com "Ping
  # indisponível". Pior: um valor ajustado à mão no host some no próximo
  # reboot do servidor — foi o que derrubou a produção em 2026-10-14.
  #
  # Este guardião é privilegiado só para gravar esse sysctl no host; a API
  # continua sem capability nenhuma. Ele sobe com o Docker a cada boot
  # (`unless-stopped` — um serviço que grava e sai não voltaria) e confere a
  # cada `ICMP_SYSCTL_INTERVAL` segundos. Só amplia (`0 2147483647`, ou
  # `0 65535` no Synology); se o host já libera, não toca em nada. A ordem
  # entre ele e a API não importa: a API tenta abrir o socket a cada uso.
  # Prefere cuidar disso no host? Persista o sysctl em /etc/sysctl.d/ e o
  # guardião só observa.
  icmp-sysctl:
    build:
      context: .
      target: runtime
    image: netmonitor:latest
    network_mode: host
    privileged: true
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/ping-group-range.sh", "--watch"]
    environment:
      ICMP_SYSCTL_INTERVAL: ${ICMP_SYSCTL_INTERVAL:-300}
    # Não tem porta, banco nem estado; o healthcheck da imagem é o da API.
    healthcheck:
      disable: true

  netmonitor:
    network_mode: host
    ports: !reset []
    sysctls: !reset {}
    depends_on:
      - icmp-sysctl
    environment:
      # Sem mapeamento, a porta escutada é também a que entra nos comandos dos
      # roteadores. Pode ser alterada por SYSLOG_LISTEN_PORT no `.env`.
      SYSLOG_EXTERNAL_PORT: ${SYSLOG_LISTEN_PORT:-5514}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${APP_PORT:-3333}}
      # Sem mapeamento, a porta publicada é a própria porta de escuta.
      APP_EXTERNAL_PORT: ${APP_PORT:-3333}
      # No modo host, a porta anunciada para a VPN é a própria porta de escuta do WireGuard.
      WG_EXTERNAL_PORT: ${WG_LISTEN_PORT:-51820}
      # Fora da rede do compose o nome `ollaya` não resolve: a API alcança o
      # Ollaya no loopback do host, logo abaixo.
      OLLAYA_URL: http://127.0.0.1:${OLLAYA_HOST_PORT:-11435}

  # Com a API na rede do host o nome `netmonitor` não resolve: o agente local
  # vai junto para a rede do host e a alcança no loopback, sem publicação no
  # meio. Com isso as métricas de interface também passam a ser as do host.
  netmonitor-agent:
    network_mode: host
    environment:
      AGENT_SERVER_URL: http://127.0.0.1:${APP_PORT:-3333}

  # O Ollaya também na rede do host, escutando só no loopback: continua
  # invisível para a rede, e a API — que no modo host *é* o host — o encontra
  # em 127.0.0.1 sem publicação de porta no meio. Publicar em `127.0.0.1`
  # dependia do docker-proxy/NAT do Docker para o loopback, que alguns hosts
  # (NAS, `userland-proxy: false`) não fazem: a porta aparecia no `docker ps`
  # e a conexão era recusada.
  ollaya:
    network_mode: host
    environment:
      OLLAYA_HOST: 127.0.0.1:${OLLAYA_HOST_PORT:-11435}
