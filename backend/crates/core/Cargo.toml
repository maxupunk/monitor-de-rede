[package]
name = "netmonitor-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Núcleo do NetMonitor (ADR 017): dados, erros, transações e barramento de eventos. Não depende de nenhuma área."

[dependencies]
loco-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
sea-orm = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
ts-rs = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
chacha20poly1305 = { workspace = true }
russh = { workspace = true }
validator = { workspace = true }
tokio-util = { workspace = true }
netmonitor-agent-protocol = { workspace = true }
# Destinos de armazenamento (backups do sistema e dos bancos).
opendal = { workspace = true }
russh-sftp = { workspace = true }
# Socket ICMP DGRAM sem privilégio (ADR 003): o cliente do processo e a
# sonda usada pelos checkers e pela área Rede.
surge-ping = { workspace = true }
# Faixas extras de alvo de equipamento (`AGENT_DEVICE_CIDRS`).
ipnet = { version = "2.9" }
socket2 = { workspace = true }
# Severidade canônica do syslog nos adapters de plataforma.
syslog_loose = { workspace = true }

# `statvfs` do armazenamento no coletor de saúde (só Unix; no Windows a
# métrica é declarada indisponível).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2" }

[dev-dependencies]
migration = { path = "../../migration" }
loco-rs = { workspace = true, features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
serial_test = { version = "3.1.1" }
tempfile = { version = "3" }
