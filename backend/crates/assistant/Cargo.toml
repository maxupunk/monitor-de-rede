[package]
name = "netmonitor-assistant"
version = "0.1.0"
edition = "2021"
publish = false
description = "Assistente do NetMonitor (ADR 017): chat com ferramentas, provedores de LLM, Decisor, rotinas automáticas e conversas. Depende só do núcleo."

[lib]
name = "netmonitor_assistant"

[dependencies]
sea-orm-migration = { workspace = true }
netmonitor-core = { workspace = true }
loco-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { workspace = true, features = ["codec"] }
futures = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
sea-orm = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
ts-rs = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
# Provedores de LLM, Decisor e pesquisa na web.
reqwest = { workspace = true }

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
tempfile = { version = "3" }
