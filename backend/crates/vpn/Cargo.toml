[package]
name = "netmonitor-vpn"
version = "0.1.0"
edition = "2021"
publish = false
description = "Área VPN do NetMonitor (ADR 017): servidor e peers WireGuard, configuração para o watcher, cofre das chaves e scripts de cliente. Depende só do núcleo."

[lib]
name = "netmonitor_vpn"

[dependencies]
netmonitor-core = { workspace = true }
loco-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
sea-orm = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
# IP público visto pela internet (pré-voo).
reqwest = { workspace = true }
# Par de chaves do WireGuard (Curve25519).
x25519-dalek = { version = "2", features = ["static_secrets"] }
# QR Code do arquivo do peer, para o app móvel.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
