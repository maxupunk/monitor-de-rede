[package]
name = "netmonitor-mcp"
version = "0.1.0"
edition = "2021"
publish = false
description = "Servidor MCP Streamable HTTP e gestão de tokens pessoais do NetMonitor (ADR 024). Depende apenas do núcleo (netmonitor-core)."

[lib]
name = "netmonitor_mcp"

[dependencies]
netmonitor-core = { workspace = true }
sea-orm-migration = { workspace = true }
loco-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
sea-orm = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "4.0.1" }
