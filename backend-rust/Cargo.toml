[workspace]

[package]
name = "backend_rust"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "backend_rust-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.0" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# `process` e `fs` existem por causa do fallback de ping no Windows (§3.2.3) e da
# escrita atômica do wg0.conf (§8.10); `signal` desliga o scheduler com graça.
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "time",
  "sync",
  "macros",
  "process",
  "fs",
  "signal",
  "io-util",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7" }
futures = { version = "0.3" }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }

# --- rede: ICMP nativo (substitui execFile('ping'), §3.2) ---
surge-ping = { version = "0.8" }
# 0.6, e não o 0.5 do rascunho da §3.1: `surge-ping` 0.8 pede `socket2 ^0.6`, e
# `sock_type_hint` recebe o `socket2::Type` **daquela** versão. Com duas majors
# na árvore o tipo não unifica e o ICMP DGRAM não compila (SPIKE-03).
socket2 = { version = "0.6" }          # sock_type_hint / fallback DGRAM
rand = { version = "0.8" }             # identifier/sequence do ICMP

# --- rede: DNS (wire format + DoH, §3.4 SPIKE-04) ---
hickory-proto = { version = "0.24", default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }

# --- rede: SNMP (§3.4 SPIKE-01) ---
rasn = { version = "0.18" }
rasn-snmp = { version = "0.18" }
rasn-smi = { version = "0.18" }

# --- criptografia ---
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10" }
base64 = { version = "0.22" }
sha2 = { version = "0.10" }
hex = { version = "0.4" }

# --- artefatos VPN ---
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# --- utilitários ---
anyhow = { version = "1" }             # AppError::Internal (§8.1) — erro opaco de infra
ipnet = { version = "2.9" }            # CIDR IPv4 (discovery + VPN)
serde_yaml = { version = "0.9" }       # fixtures / seeds
thiserror = { version = "2" }
num_cpus = { version = "1.16" }

# --- discovery e topologia (Fase 5) ---
mdns-sd = { version = "0.13" }
# A 0.4 exige generators nightly (`futures-async-stream`) e não compila no
# Rust estável usado pelo Loco. A API 2.x mantém SSDP assíncrono sem esse risco.
ssdp-client = { version = "2.1" }
petgraph = { version = "0.7" }
phf = { version = "0.11", features = ["macros"] }
quick-xml = { version = "0.37", features = ["serialize"] }

[[bin]]
name = "backend_rust-cli"
path = "src/bin/main.rs"
required-features = []
[[bin]]
name = "tool"
path = "src/bin/tool.rs"
required-features = []

# Protótipos dos spikes da Fase 0 (§3.4). Ficam em `examples/spikes/` para não
# entrar no binário de produção; como não estão na raiz de `examples/`, o cargo
# não os descobre sozinho — daí as entradas explícitas.
[[example]]
name = "spike_icmp_dgram"
path = "examples/spikes/icmp_dgram.rs"
[[example]]
name = "spike_snmp_v2c"
path = "examples/spikes/snmp_v2c.rs"
[[example]]
name = "spike_dns_wire"
path = "examples/spikes/dns_wire.rs"

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
