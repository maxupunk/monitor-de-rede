# Loco configuration file documentation

# Application logging configuration
logger:
  # Enable or disable logging.
  enable: true
  # Enable pretty backtrace (sets RUST_BACKTRACE=1)
  pretty_backtrace: true
  # Log level, options: trace, debug, info, warn or error.
  level: debug
  # Define the logging format. options: compact, pretty or json
  format: compact
  # By default the logger has filtering only logs that came from your code or logs that came from `loco` framework. to see all third party libraries
  # Uncomment the line below to override to see all third party libraries you can enable this config and override the logger filters.
  # override_filter: trace

# Web server configuration
server:
  # 3333 é contrato, não preferência: o proxy do Vite (`frontend/vite.config.ts`)
  # e o docker-compose apontam para esta porta. O scaffold do Loco vem com 5150.
  port: 3333
  # Binding for the server (which interface to bind to)
  binding: localhost
  # The UI hostname or IP address that mailers will point to.
  host: http://localhost
  # Out of the box middleware configuration. to disable middleware you can changed the `enable` field to `false` of comment the middleware block
  middlewares:
    # Em dev o frontend roda no Vite (5173) e chega via proxy — que preserva a
    # origem quando `changeOrigin` reescreve só o Host. Liberar a origem do Vite
    # cobre também o acesso direto a http://localhost:3333 durante depuração.
    cors:
      enable: true
      allow_origins:
        - "{{ get_env(name="FRONTEND_ORIGIN", default="http://localhost:5173") }}"
      allow_headers: [content-type, authorization, accept, x-probe-token]
      allow_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      # `retry-after` é lido pelo frontend nos 429 dos endpoints de VPN (§7.13).
      expose_headers: [retry-after]
      max_age: 86400

# Worker Configuration
workers:
  # specifies the worker mode. Options:
  #   - BackgroundQueue - Workers operate asynchronously in the background, processing queued.
  #   - ForegroundBlocking - Workers operate in the foreground and block until tasks are completed.
  #   - BackgroundAsync - Workers operate asynchronously in the background, processing tasks with async capabilities.
  mode: BackgroundAsync

  

# Mailer Configuration.
mailer:
  # SMTP mailer configuration.
  smtp:
    # Enable/Disable smtp mailer.
    enable: true
    # SMTP server host. e.x localhost, smtp.gmail.com
    host: localhost
    # SMTP server port
    port: 1025
    # Use secure connection (SSL/TLS).
    secure: false
    # auth:
    #   user:
    #   password:
    # Override the SMTP hello name (default is the machine's hostname)
    # hello_name:

# Initializers Configuration
# initializers:
#  oauth2:
#    authorization_code: # Authorization code grant type
#      - client_identifier: google # Identifier for the OAuth2 provider. Replace 'google' with your provider's name if different, must be unique within the oauth2 config.
#        ... other fields

# Database Configuration
database:
  # Database connection URI
  uri: {{ get_env(name="DATABASE_URL", default="sqlite://backend_rust_development.sqlite?mode=rwc") }}
  # When enabled, the sql query will be logged.
  enable_logging: false
  # ⚠️ Os dois tempos abaixo são em **milissegundos** — o Loco os passa a
  # `Duration::from_millis`, e o nome não denuncia isso. Os 500 do scaffold
  # faziam a `idle_timeout` derrubar toda conexão meio segundo depois de ficar
  # ociosa: o pool recriava o conjunto inteiro a cada poucos segundos, em todos
  # os processos — inclusive no `probe`, que nunca consulta o banco mas ganha um
  # pool assim mesmo. O Postgres registrava cada queda ("could not receive data
  # from client: Connection reset by peer") e o log virava ruído contínuo.
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="5000") }}
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="300000") }}
  # Minimum number of connections for a pool.
  min_connections: {{ get_env(name="DB_MIN_CONNECTIONS", default="1") }}
  # Maximum number of connections for a pool.
  max_connections: {{ get_env(name="DB_MAX_CONNECTIONS", default="1") }}
  # Run migration up when application loaded
  auto_migrate: true
  # Truncate database when application loaded. This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_truncate: false
  # Recreating schema when application loaded.  This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_recreate: false

# Authentication Configuration
auth:
  # JWT authentication
  jwt:
    # EventSource não permite Authorization; o Loco tenta Bearer primeiro e
    # depois `?token=` apenas para os streams autenticados.
    location:
      - from: Bearer
      - from: Query
        name: token
    # Segredo de assinatura. Lê `JWT_SECRET` como o `production.yaml` faz: com
    # o valor fixo do scaffold, um `JWT_SECRET` no `.env` era silenciosamente
    # ignorado em dev — e o mesmo `.env` produzia sessões diferentes conforme o
    # ambiente, sem nada no log dizendo por quê.
    # ⚠️ Precisa ser base64 válido (`EncodingKey::from_base64_secret`, HS512).
    secret: {{ get_env(name="JWT_SECRET", default="v06Wz0VIum5J6JzeKtFl") }}
    # Token expiration time in seconds
    expiration: 604800 # 7 days
