name: netmonitor_app
description: "NetMonitor — Plataforma de Monitoramento de Redes, Servidores e VPN."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  http: ^1.3.0
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  intl: any
  fl_chart: ^0.70.2
  qr_flutter: ^4.1.0
  flutter_markdown_plus: ^1.0.3
  url_launcher: ^6.3.1
  file_picker: ^9.0.2
  share_plus: ^10.1.4
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
