name: Agent Image

# Publica a imagem do agente remoto (`Dockerfile`, alvo `agent`, ADR 011) no
# GitHub Container Registry: ghcr.io/<dono>/netmonitor-agent.
#
# Roda numa tag de versão (`v1.2.3` → `1.2.3`, `1.2` e `latest`) ou à mão pela
# aba Actions (tag `sha-<commit>`, mais `latest` se marcado). Cada arquitetura
# compila no runner nativo dela — Rust sob emulação QEMU levaria horas — e o
# último job junta as duas num único manifesto multi-arquitetura.
#
# Depois da primeira publicação, marque o pacote como público em
# github.com/<dono>?tab=packages para os servidores baixarem sem `docker login`.
# Na central, aponte `AGENT_IMAGE=ghcr.io/<dono>/netmonitor-agent:<versão>`.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      latest:
        description: "Também marcar como latest"
        type: boolean
        default: false

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      # O runner arm64 nem sempre está disponível para o repositório: a falha
      # dele não pode derrubar a publicação amd64.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            optional: false
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            optional: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O nome do registry precisa ser minúsculo; o do dono do repositório
      # pode não ser.
      - name: Resolve image name
        id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/netmonitor-agent" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Carrega localmente para o teste de fumaça antes de publicar qualquer byte.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent
          platforms: ${{ matrix.platform }}
          load: true
          tags: netmonitor-agent:smoke
          cache-from: type=gha,scope=agent-${{ steps.name.outputs.arch }}
          cache-to: type=gha,mode=max,scope=agent-${{ steps.name.outputs.arch }}

      # Sem AGENT_SERVER_URL o agente precisa sair com código 2 e a mensagem de
      # configuração: prova que o binário estático roda na imagem final.
      - name: Smoke test
        run: |
          set +e
          output=$(docker run --rm netmonitor-agent:smoke 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -eq 2
          echo "$output" | grep -q "AGENT_SERVER_URL"
          docker run --rm --entrypoint docker netmonitor-agent:smoke compose version

      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agent-${{ steps.name.outputs.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Agente remoto do NetMonitor (Docker, host e monitores)
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-digest-${{ steps.name.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netmonitor-agent" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') || inputs.latest == true }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ steps.name.outputs.image }}

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
