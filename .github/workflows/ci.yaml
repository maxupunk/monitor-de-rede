name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

# Um push novo na mesma branch cancela o run anterior, que já não importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Todos os jobs do backend rodam a partir de backend/; os do frontend a partir de
# frontend/. O workflow fica na raiz porque é o único lugar que o GitHub Actions
# lê (INF-01 / SEC-03).
#
# Versões fixas, uma fonte só para local, CI e Dockerfile: o Rust (e o rustfmt e
# o clippy) vem de `backend/rust-toolchain.toml`; o Flutter, do
# `environment.flutter` de `frontend/pubspec.yaml`. Um `stable` solto trazia
# lints novos e quebrava o CI sem nenhuma mudança no código. A auditoria de
# dependências mora em `security-audit.yml`.
jobs:
  rustfmt:
    name: Check Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test-sqlite:
    name: Run Tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - name: Run cargo test
        run: cargo test --all-targets

  test-postgres:
    name: Run Tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_DB: postgres_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - name: Run cargo test
        run: cargo test --all-targets
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres_test

  frontend:
    name: Frontend Checks (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # A versão vem do `environment.flutter` do pubspec — a mesma do
          # ambiente local e do Dockerfile.
          flutter-version-file: frontend/pubspec.yaml
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Web (PWA)
        run: flutter build web --release --no-web-resources-cdn

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: false
          tags: netmonitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
